############################################################
# API: s3-api.ikerketa.com → MinIO API (9000)
############################################################

server {
    listen 443 ssl http2;
    server_name s3-api.ikerketa.com;

    allow 172.18.0.0/24;
    deny all;

    ssl_certificate     /etc/letsencrypt/live/ikerketa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ikerketa.com/privkey.pem;

    proxy_buffering off;

    location / {
        proxy_pass http://minio:9000;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # WebRPC (API) - importante
    location /minio/webrpc {
        proxy_pass http://minio:9000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}



############################################################
# Console: s3.ikerketa.com → MinIO Console (9001)
