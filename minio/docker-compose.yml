services:
  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    container_name: minio
    volumes:
      - ./data:/mnt/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://${MINIO_API_SUBDOMAIN}
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_SUBDOMAIN}
      MINIO_BROWSER_ENABLE_LICENSING: off
    networks:
      vpn:
        ipv4_address: ${PRIVATE_MINIO_ADDRESS}
    dns:
      - ${PRIVATE_COREDNS_ADDRESS}
    restart: unless-stopped
    command: server /mnt/minio --console-address ":9001"

networks:
  vpn:
    external: true
